name: Refresh profile visuals
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public snapshot and render diagrams
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 profile/refresh.py
      - name: Commit updated visuals
        run: |
          git add profile/data.json assets/profile/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile charts'
          git push
